<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上課小幫手</title>
<style>
  :root { --bg:#14181f; --panel:#1d232d; --line:#303a48; --text:#e8ecf2; --dim:#94a0b3; --accent:#ffb347; --ok:#5fd08a; --bad:#ff7b72; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif; display:flex; flex-direction:column; }
  button, input, textarea { font:inherit; color:inherit; }
  button { background:#2a3340; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#354152; }
  button.on { background:#7a2b2b; border-color:#b24a4a; }
  #bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  #bar label { color:var(--dim); font-size:14px; display:flex; align-items:center; gap:4px; }
  #engine { font-size:13px; color:var(--accent); }
  #meterBox { font-size:13px; color:var(--dim); display:flex; align-items:center; gap:4px; }
  #meter { display:inline-block; width:90px; height:8px; background:#0d1117; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  #meterFill { display:block; height:100%; width:0; background:var(--ok); }
  #status { margin-left:auto; font-size:14px; color:var(--dim); }
  #status.ok { color:var(--ok); } #status.bad { color:var(--bad); }
  #cfg { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; background:#232b37; border-bottom:1px solid var(--line); font-size:14px; }
  #cfg input { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  .cfgrow { flex-basis:100%; } #glossIn { width:100%; height:150px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; margin:4px 0; } #keyIn { width:320px; } #modelIn { width:180px; }
  #main { flex:1; display:flex; min-height:0; }
  #left { flex:1.3; display:flex; flex-direction:column; min-width:200px; }
  #right { flex:1; display:flex; flex-direction:column; min-width:200px; }
  #split { flex:0 0 7px; cursor:col-resize; background:var(--line); }
  #split:hover, #split.drag { background:var(--accent); }
  #nav { display:flex; gap:8px; align-items:center; padding:6px 12px; font-size:14px; color:var(--dim); }
  #slideWrap { flex:1; overflow:auto; padding:0 12px; min-height:0; }
  #slide { display:block; max-width:100%; background:#fff; border-radius:4px; }
  #empty { color:var(--dim); padding:40px 12px; text-align:center; line-height:1.9; }
  #tools { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:0 12px 6px; font-size:13px; }
  #tools button { padding:3px 9px; font-size:13px; }
  #tools button.on { background:#7a5a12; border-color:var(--accent); }
  #toolHint { color:var(--accent); font-size:13px; }
  #slideBox { position:relative; display:inline-block; line-height:0; max-width:100%; }
  #ink { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  #slideBox.mode-erase #ink { pointer-events:auto; touch-action:none; cursor:cell; }
  #penOpts { display:inline-flex; align-items:center; gap:6px; }
  #penOpts[hidden] { display:none; }
  #tools #penOpts .pc { width:24px; height:24px; padding:0; border-radius:50%; border:2px solid #5b6778; }
  #tools #penOpts .pc.hi { border-radius:5px; width:30px; }
  #tools #penOpts .pc.on { border-color:#fff; box-shadow:0 0 0 3px var(--accent); }
  #tools #penOpts .pw { width:28px; height:28px; padding:0; display:inline-flex; align-items:center; justify-content:center; }
  #penOpts .pw i { display:block; border-radius:50%; background:var(--text); }
  #left.popped #tools #penOpts .pw { width:40px; height:40px; }
  #penOpts .sep { width:1px; height:20px; background:var(--line); margin:0 2px; }
  #left.popped #tools #penOpts .pc { width:36px; height:36px; }
  #left.popped #tools #penOpts .pc.hi { width:44px; }
  #penOnlyBox { font-size:13px; color:var(--dim); display:flex; align-items:center; gap:4px; }
  #ptrType { font-size:12px; color:var(--dim); }
  #left.popped { flex:1 1 auto !important; min-width:0; min-height:0; border-right:none; }
  #left.popped #nav, #left.popped #tools { padding:6px 10px; gap:8px; }
  #left.popped button { padding:9px 14px; font-size:16px; }
  #left.popped #hits { display:none; }
  #left.popped #note { height:40px; }
  #left.popped #slideWrap { display:flex; justify-content:center; align-items:flex-start; padding:0 6px; }
  #left.popped .pin { width:30px; height:30px; font:bold 15px/30px sans-serif; }
  #inkPred { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  #slideBox.mode-pen #ink { pointer-events:auto; touch-action:none; cursor:crosshair; }
  #slideBox.mode-pin { cursor:copy; }
  #pinLayer { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .pin { position:absolute; transform:translate(-50%,-50%); width:22px; height:22px; border-radius:50%; background:#e53935; color:#fff; font:bold 12px/22px sans-serif; text-align:center; pointer-events:auto; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.6); border:1px solid #fff; }
  .pin { touch-action:none; cursor:grab; user-select:none; }
  .pin.sel { outline:3px solid var(--accent); }
  #pinPop { position:fixed; z-index:50; width:300px; background:var(--panel); border:1px solid var(--accent); border-radius:8px; padding:8px; box-shadow:0 6px 24px rgba(0,0,0,.6); }
  #pinPop .ph { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  #pinPop .num { flex:0 0 22px; height:22px; border-radius:50%; background:#e53935; color:#fff; font:bold 12px/22px sans-serif; text-align:center; }
  #pinPop textarea { width:100%; height:90px; resize:vertical; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px; font-size:14px; }
  #pinPop .pf { display:flex; justify-content:space-between; margin-top:6px; }
  #pinPop button { padding:3px 12px; font-size:13px; }
  .pinbtn { margin-left:8px; padding:0 6px; font-size:12px; border-radius:10px; cursor:grab; }
  #hits { padding:4px 12px; min-height:28px; font-size:13px; color:var(--dim); }
  #hits span { display:inline-block; background:#4a3a14; color:var(--accent); border-radius:10px; padding:1px 8px; margin:2px 4px 2px 0; }
  #note { margin:6px 12px 10px; height:54px; resize:vertical; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; }
  #caps { flex:1; overflow:auto; padding:10px 12px; min-height:0; }
  .line { padding:4px 8px; border-radius:6px; margin-bottom:2px; cursor:pointer; border-left:3px solid transparent; line-height:1.35; }
  .line:hover { background:var(--panel); }
  .line.star { background:#33290f; border-left-color:var(--accent); }
  .line .meta { font-size:11px; color:var(--dim); }
  .line .en { font-size:12px; color:#8f9bb0; }
  .line .zh { font-size:15px; margin-top:1px; }
  #interim { padding:6px 12px; color:var(--dim); font-style:italic; min-height:34px; border-top:1px solid var(--line); }
  #ask { padding:4px 12px; border-top:1px solid var(--line); background:var(--panel); }
  #askToggle { font-size:12px; padding:2px 10px; }
  #askBody { margin-top:6px; padding-bottom:6px; }
  #ask .row { display:flex; gap:8px; align-items:flex-start; }
  #askIn { flex:1; height:44px; resize:vertical; line-height:1.5; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  #askOut { margin-top:6px; font-size:16px; color:var(--accent); }
  .hint { font-size:12px; color:var(--dim); }
</style>
</head>
<body>

<div id="bar">
  <label>投影片 PDF <input type="file" id="file" accept="application/pdf"></label>
  <button id="listen">🎤 開始聽</button>
  <label><input type="checkbox" id="follow"> 自動對頁</label>
  <label><input type="checkbox" id="autoscroll" checked> 字幕自動捲到最新</label>
  <label title="用筆電本機的語音辨識，聲音不會傳到 Google。這台電腦不支援時會自動改用雲端。"><input type="checkbox" id="localSR" checked> 本機語音辨識</label>
  <button id="export">⬇ 匯出筆記</button>
  <button id="popBtn" title="把投影片拆成獨立視窗，可以拖到 iPad 延伸螢幕上手寫">🖥 投影片獨立視窗</button>
  <button id="clear">清除紀錄</button>
  <button id="cfgBtn">⚙ AI 翻譯</button>
  <span id="ver" style="font-size:12px;color:var(--dim)">版本 31</span>
  <span id="engine"></span>
  <span id="meterBox" title="麥克風收到的音量">🎚 <span id="meter"><span id="meterFill"></span></span></span>
  <span id="status">尚未開始</span>
</div>

<div id="cfg" hidden>
  <span>AI 金鑰</span>
  <input id="keyIn" type="password" placeholder="貼上 API 金鑰（只存在這台電腦）">
  <span>模型</span>
  <input id="modelIn" placeholder="claude-haiku-5-5">
  <button id="cfgSave">儲存</button>
  <span class="hint">留空白就用一般翻譯。金鑰不要放到 GitHub 上。</span>
  <div class="cfgrow">
    <label><input type="checkbox" id="sendSlide"> 把當頁投影片文字也傳給 AI 參考（教材不能外流時請不要勾）</label>
  </div>
  <div class="cfgrow">
    <div class="hint">名詞表：一行一個，格式是「英文 = 中文」。行首加 * 的詞，翻譯時會寫成「中文（英文）」；不想並列就把 * 刪掉。可以自己增加或修改，只存在這台電腦。</div>
    <textarea id="glossIn" spellcheck="false"></textarea>
    <button id="glossReset">還原成預設名詞表</button>
  </div>
</div>

<div id="main">
  <div id="left">
    <div id="nav">
      <button id="prev">◀ 上一頁</button>
      <span id="pageInfo">尚未載入投影片</span>
      <button id="next">下一頁 ▶</button>
      <button id="fsBtn" hidden>⛶ 全螢幕</button>
      <button id="dockBtn" hidden>↩ 收回筆電</button>
      <span id="ptrType"></span>
    </div>
    <div id="tools">
      <button id="tPin" title="按一下後，在投影片上點要釘便條的位置">📌 便條</button>
      <button id="tPen" title="用手指、觸控筆或滑鼠直接畫">✏️ 畫筆</button>
      <span id="penOpts" hidden>
        <button class="pc" data-c="#111111" data-w="3" title="黑筆" aria-label="黑筆" style="background:#111111"></button>
        <button class="pc on" data-c="#e53935" data-w="3" title="紅筆" aria-label="紅筆" style="background:#e53935"></button>
        <button class="pc" data-c="#1e6fff" data-w="3" title="藍筆" aria-label="藍筆" style="background:#1e6fff"></button>
        <button class="pc" data-c="#1b9e3e" data-w="3" title="綠筆" aria-label="綠筆" style="background:#1b9e3e"></button>
        <button class="pc" data-c="#f57c00" data-w="3" title="橘筆" aria-label="橘筆" style="background:#f57c00"></button>
        <button class="pc" data-c="#8e24aa" data-w="3" title="紫筆" aria-label="紫筆" style="background:#8e24aa"></button>
        <span class="sep"></span>
        <button class="pc hi" data-c="rgba(255,235,59,0.45)" data-w="16" title="黃色螢光筆" aria-label="黃色螢光筆" style="background:#ffeb3b"></button>
        <button class="pc hi" data-c="rgba(105,240,174,0.45)" data-w="16" title="綠色螢光筆" aria-label="綠色螢光筆" style="background:#69f0ae"></button>
        <button class="pc hi" data-c="rgba(255,128,171,0.45)" data-w="16" title="粉紅螢光筆" aria-label="粉紅螢光筆" style="background:#ff80ab"></button>
        <span class="sep"></span>
        <button class="pw" data-s="0.5" title="細" aria-label="細"><i style="width:4px;height:4px"></i></button>
        <button class="pw on" data-s="1" title="中" aria-label="中"><i style="width:8px;height:8px"></i></button>
        <button class="pw" data-s="2" title="粗" aria-label="粗"><i style="width:14px;height:14px"></i></button>
      </span>
      <button id="tErase" title="在筆跡上劃過，擦掉整筆">🧽 橡皮擦</button>
      <button id="tUndo">↩ 復原</button>
      <button id="tClear">清除本頁筆跡</button>
      <label id="penOnlyBox" title="勾選後，手指和手掌碰到投影片不會留下筆跡"><input type="checkbox" id="penOnly"> 只有筆尖能畫</label>
      <span id="toolHint"></span>
    </div>
    <div id="slideWrap">
      <div id="empty">請用左上角選擇 PDF 投影片。<br>沒有投影片也可以直接按「開始聽」，只用字幕翻譯。</div>
      <div id="slideBox" hidden><canvas id="slide"></canvas><canvas id="ink"></canvas><canvas id="inkPred"></canvas><div id="pinLayer"></div></div>
    </div>
    <div id="hits"></div>
    <textarea id="note" placeholder="這一頁的筆記（會自動儲存）"></textarea>
    <div id="pinPop" hidden>
      <div class="ph"><span class="num" id="popNum"></span><span class="hint">便條（可拖曳圖釘移動位置）</span></div>
      <textarea id="popText" placeholder="便條內容"></textarea>
      <div class="pf"><button id="popDel">刪除</button><button id="popOk">完成</button></div>
    </div>
  </div>

  <div id="split" title="左右拖曳調整寬度"></div>
  <div id="right">
    <div id="caps"></div>
    <div id="interim"></div>
    <div id="diag" class="hint" style="padding:2px 12px"></div>
    <div id="ask">
      <button id="askToggle" title="展開或收起提問小幫手">💬 提問小幫手 ▸</button>
      <div id="askBody" hidden>
      <div class="hint">用中文打想問的問題，按 Enter 變成英文問句（Shift + Enter 換行）</div>
      <div class="row">
        <textarea id="askIn" placeholder="例如：這個設定預設值是多少"></textarea>
        <button id="askGo">翻成英文</button>
        <button id="askSay">🔊 唸給我聽</button>
      </div>
      <div id="askOut"></div>
      </div>
    </div>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
let slideDoc = null, slideWin = null;   // 投影片拆到獨立視窗時，那個視窗和它的文件
const $ = id => document.getElementById(id) || (slideDoc ? slideDoc.getElementById(id) : null);
const setStatus = (msg, cls) => { $("status").textContent = msg; $("status").className = cls || ""; };
let curEngine = "";
const setEngine = name => { curEngine = name; $("engine").textContent = "翻譯：" + name; };

// ---------- 儲存 ----------
let notes = {}, log = [], annots = {}, curDoc = "";
// 筆記、便條、筆跡都依「檔名＋頁碼」存放，換一份投影片不會互相蓋掉
const pk = p => (curDoc ? curDoc + "#" : "") + p;
try { annots = JSON.parse(localStorage.getItem("ch_annot") || "{}"); } catch (e) {}
function saveA() {
  try { localStorage.setItem("ch_annot", JSON.stringify(annots)); }
  catch (e) { setStatus("筆跡太多，瀏覽器存不下了：請先匯出筆記，再清除紀錄", "bad"); }
}
try { notes = JSON.parse(localStorage.getItem("ch_notes") || "{}"); } catch (e) {}
try { log = JSON.parse(localStorage.getItem("ch_log") || "[]"); } catch (e) {}
function save() {
  try {
    localStorage.setItem("ch_notes", JSON.stringify(notes));
    localStorage.setItem("ch_log", JSON.stringify(log));
  } catch (e) {}
}

// ---------- AI 翻譯設定 ----------
const DEFAULT_MODEL = "claude-haiku-5-5";
const DEFAULT_GLOSS = "* MANET = 行動隨意網路\n* ad hoc network = 隨意網路（不靠固定設施、臨時自組的網路）\nmesh network = 網狀網路\nnode = 節點\nmaster node = 主節點\nrelay = 中繼\nhop = 跳（訊號經過一個節點算一跳）\nmulti-hop = 多跳\nrouting = 路由\n* routing protocol = 路由協定\n* topology = 拓撲（網路的連接架構）\n* self-forming = 自動組網\n* self-configuring = 自我組態\n* self-healing = 自我修復\ninfrastructure = 基礎設施\nbase station = 基地台\nrepeater = 中繼台\ngateway = 閘道\n* backhaul = 回程鏈路\nlink = 鏈路\n* link budget = 鏈路預算\n* line of sight (LOS) = 視距\n* non-line of sight (NLOS) = 非視距\ncoverage = 涵蓋範圍\nrange = 通訊距離\n* throughput = 傳輸量\nbandwidth = 頻寬\nlatency = 延遲\nfrequency band = 頻段\nchannel = 頻道\nspectrum = 頻譜\ninterference = 干擾\nantenna = 天線\nomnidirectional antenna = 全向天線\ndirectional antenna = 指向天線\ngain = 增益\ntransmit power = 發射功率\n* SNR (signal-to-noise ratio) = 訊雜比\n* RSSI = 接收訊號強度指標\n* MIMO = 多輸入多輸出\n* waveform = 波形\nencryption = 加密\npacket = 封包\npacket loss = 封包遺失\n* QoS = 服務品質\nIP address = IP 位址\nsubnet = 子網路\n* DHCP = 動態主機設定協定\n* VLAN = 虛擬區域網路\nunicast = 單播\n* multicast = 群播\nbroadcast = 廣播\n* PTT (push-to-talk) = 按鍵通話\n* talk group = 通話群組\n* LMR (land mobile radio) = 陸地行動無線電\n* trunking = 集群式無線電\n* DMR = 數位行動無線電\n* TETRA = TETRA 數位集群無線電\n* P25 = P25 數位無線電標準\n* interoperability = 互通性\n* situational awareness = 狀況覺知\n* incident command = 事故現場指揮\nfirst responder = 第一線救災人員\ndeployment = 部署\nconfiguration = 設定\nfirmware = 韌體\nUAV = 無人機\nvideo streaming = 影像串流\nGNSS = 衛星定位\non the fly = 即時、當場（不事先規劃，臨時組成）\non the go = 在移動中\n* spontaneous network = 自發性網路\n* single point of failure = 單點故障\ndecentralized = 去中心化\nfixed infrastructure = 固定基礎設施\npre-existing infrastructure = 既有基礎設施\nhost = 主機\nrouter = 路由器\nendpoint = 端點\n* peer = 對等節點\nscalability = 擴充性\n* dynamic topology = 動態拓撲\n* dynamic routing = 動態路由\n* adaptive routing = 自適應路由\n* alternate route = 替代路由\nseamless = 無縫\noverloaded = 過載\nrapidly deployed = 快速部署\nparadigm = 模式\nPersistent Systems = Persistent Systems（廠商名，保留英文）\nWave Relay = Wave Relay（該廠商的 MANET 技術與產品名，保留英文）\nMPU5 = MPU5（無線電機 try {
  const g = localStorage.getItem("ch_gloss");

    // 使用者存過名詞表：保留她的內容，只把預設表裡新增、她還沒有的詞補在後面
    const bare = l => l.replace(/^\s*\*\s*/, "").trim();
    const key = l => bare(l).split("=")[0].trim().toLowerCase();
    let lines = g.split("\n");
    // 只做一次：她沒改過的詞，如果預設表現在標了 *（中英並列），就幫她補上 *
    if (localStorage.getItem("ch_gloss_star") !== "1") {
      const def = {}; DEFAULT_GLOSS.split("\n").forEach(l => { def[key(l)] = l; });
      lines = lines.map(l => (def[key(l)] && def[key(l)].startsWith("*") && bare(def[key(l)]) === bare(l)) ? def[key(l)] : l);
      localStorage.setItem("ch_gloss_star", "1");
    }
    const have = new Set(lines.map(key));
    const add = g.trim() ? DEFAULT_GLOSS.split("\n").filter(l => l.trim() && !have.has(key(l))) : [];

async function callAI(system, user, history) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": aiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: aiModel, max_tokens: 700, system: system, messages: (history || []).concat([{ role: "user", content: user }]) })
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return (j.content || []).map(c => c.text || "").join("").trim();
}

let pdf = null, page = 0, pageWords = [], pageText = [], docFreq = {}, rendering = false, pendingPage = 0;
const STOP = new Set("this that with from have will your they them then than what when where which while there their about into over also been were would could should these those here just like some more most very much many such only other each because between after before under again does doing done make made using used being".split(" "));
const words = s => (s.toLowerCase().match(/[a-z][a-z\-]{3,}/g) || []).filter(w => !STOP.has(w));

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

$("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (!window.pdfjsLib) { setStatus("PDF 元件載入失敗，請檢查網路", "bad"); return; }
  try {
    setStatus("讀取投影片中…");
    pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    pageWords = []; pageText = []; docFreq = {};
    for (let i = 1; i <= pdf.numPages; i++) {
      const p = await pdf.getPage(i);
      const tc = await p.getTextContent();
      const raw = tc.items.map(it => it.str).join(" ");
      pageText[i] = raw.slice(0, 1500);
      const set = new Set(words(raw));
      pageWords[i] = set;
      set.forEach(w => { docFreq[w] = (docFreq[w] || 0) + 1; });
    }
    curDoc = f.name; page = 0; wantPage = 0;
    $("empty").hidden = true; $("slideBox").hidden = false;
    await showPage(1);
    setStatus("投影片已載入，共 " + pdf.numPages + " 頁", "ok");
  } catch (err) {
    setStatus("PDF 讀取失敗：" + err.message, "bad");
  }
});

async function showPage(n) {
  if (!pdf) return;
  n = Math.max(1, Math.min(pdf.numPages, n));
  wantPage = n;   // 連按兩次翻頁時，第二次要從「正要去的那一頁」算起
  if (rendering) { pendingPage = n; return; }
  rendering = true;
  try {
    const p = await pdf.getPage(n);
    const base = p.getViewport({ scale: 1 });
    const wrap = $("slideWrap"), win = wrap.ownerDocument.defaultView || window;
    let width = Math.max(300, wrap.clientWidth - 24);
    // 獨立視窗時讓整頁剛好放進視窗，不用捲動
    if (slideDoc) width = Math.max(300, Math.min(wrap.clientWidth - 12, (wrap.clientHeight - 6) * base.width / base.height));
    const dpr = win.devicePixelRatio || 1;
    const vp = p.getViewport({ scale: (width / base.width) * dpr });
    const c = $("slide");
    c.width = vp.width; c.height = vp.height;
    c.style.width = (vp.width / dpr) + "px";
    await p.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    page = n;
    $("pageInfo").textContent = "第 " + n + " / " + pdf.numPages + " 頁";
    $("note").value = notes[pk(n)] || "";
    redrawAnnots();
  } catch (err) {
    setStatus("頁面顯示失敗：" + err.message, "bad");
  }
  rendering = false;
  if (pendingPage) { const q = pendingPage; pendingPage = 0; if (q !== page) showPage(q); }
  else wantPage = page;
}
let wantPage = 0;
const turn = d => showPage((wantPage || page) + d);
$("prev").onclick = () => turn(-1);
$("next").onclick = () => turn(1);
window.addEventListener("resize", () => { if (pdf) showPage(page); });

}

function drawInk(ctx, w, h, strokes) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  (strokes || []).forEach(s => {
    if (!s.pts || s.pts.length < 2) return;
    ctx.strokeStyle = s.c; ctx.lineWidth = Math.max(1, s.w * w / 1000);
    ctx.beginPath(); ctx.moveTo(s.pts[0][0] * w, s.pts[0][1] * h);
    for (let k = 1; k < s.pts.length; k++) ctx.lineTo(s.pts[k][0] * w, s.pts[k][1] * h);
    ctx.stroke();
  });
}

// ---------- 自動對頁 ----------
function followSlides() {
  if (!pdf) return;
  const recent = new Set(words(log.slice(-2).map(l => l.en).join(" ")));
  let best = 0, bestScore = 0, curScore = 0, bestHits = [], curHits = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    let s = 0; const hits = [];
    recent.forEach(w => {
      if (pageWords[i].has(w)) { s += Math.log(1 + pdf.numPages / docFreq[w]); hits.push(w); }
    });
    if (i === page) { curScore = s; curHits = hits; }
    if (s > bestScore) { bestScore = s; best = i; bestHits = hits; }
  }
  let shown = curHits;
  if ($("follow").checked && best && best !== page && bestHits.length >= 3 && bestScore > curScore * 1.6 + 1) {
    showPage(best); shown = bestHits;
  }
  const box = $("hits"); box.textContent = "";
  if (shown.length) {
    box.append("對到的關鍵字：");
    shown.slice(0, 10).forEach(w => { const s = document.createElement("span"); s.textContent = w; box.append(s); });
  }
}

// ---------- 翻譯 ----------
const translators = {};
async function getTranslator(from, to) {
  const key = from + ">" + to;
  if (key in translators) return translators[key];
  translators[key] = null;
  try {
    if ("Translator" in self) {
      const a = await Translator.availability({ sourceLanguage: from, targetLanguage: to });
      if (a !== "unavailable") {
        translators[key] = await Translator.create({ sourceLanguage: from, targetLanguage: to });
      }
    }
  } catch (e) { translators[key] = null; }
  return translators[key];
}
async function translate(text, from, to, ctx) {
  if (aiKey && from === "en") {
    try {
      // 前一段用「上一輪對話」的方式給 AI 看，它就只會接著翻新的這段，不會重翻
      const hist = (ctx && ctx.prev && ctx.prevZh && !ctx.prevZh.startsWith("（翻譯失敗")) ? [{ role: "user", content: ctx.prev }, { role: "assistant", content: ctx.prevZh }] : [];

      const lastPara = t => { const ps = t.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean); return ps.length ? ps[ps.length - 1] : t; };
      let out = lastPara(await callAI(sys, text, hist));
      // 中文通常只有英文字元數的三到四成；明顯太長多半是把前一段又翻了一次，要求它重來一次
      if (hist.length && text.length > 40 && out.length > text.length * 0.55) {
        try {
          const again = lastPara(await callAI(sys, "你的翻譯太長，包含了前面段落已經翻過的內容。請只輸出最新這一段英文對應的中文，不要重述前文，不要解釋。", hist.concat([{ role: "user", content: text }, { role: "assistant", content: out }])));
          if (again && again.length < out.length) out = again;
        } catch (e) {}
      }
      if (out) { setEngine("AI"); return out; }
    } catch (e) { setStatus("AI 翻譯失敗，先改用一般翻譯：" + e.message, "bad"); }
  }
  const t = await getTranslator(from, to);
  if (t) { try { const o = await t.translate(text); setEngine("Chrome 內建"); return o; } catch (e) {} }
  const pair = (from === "en" ? "en" : "zh-TW") + "|" + (to === "en" ? "en" : "zh-TW");
  const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + encodeURIComponent(pair));
  const j = await r.json();
  if (j && j.responseData && j.responseData.translatedText) { setEngine("線上免費（額度小）"); return j.responseData.translatedText; }
  throw new Error("翻譯服務沒有回應");
}

function toBottom() { if ($("autoscroll").checked) $("caps").scrollTop = $("caps").scrollHeight; }

// ---------- 語音辨識 ----------

      commit(pending.slice(0, take).join(" "));
      committedWords += take;
      pending = pending.slice(take);
    }
    $("interim").textContent = pending.join(" ");
  };
  rec.onerror = e => {
    lastErr = e.error + (e.message ? "（" + e.message + "）" : ""); showDiag();
    if (e.error === "no-speech" || e.error === "aborted") return;
    if (useLocal && (e.error === "language-not-supported" || e.error === "phrases-not-supported" || e.error === "service-not-allowed")) {
      useLocal = false; $("localSR").checked = false;   // 本機辨識不能用：改回雲端，onend 會自動重啟
      return;
    }
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false; updateBtn();
      setStatus("麥克風被擋住了：請點網址列左邊的圖示，把麥克風改成允許", "bad");
    } else if (e.error === "audio-capture") {
      setStatus("找不到麥克風，或麥克風被別的程式佔用", "bad");
    } else if (e.error === "network") {
      setStatus("語音辨識需要網路，請檢查連線", "bad");
    } else {
      setStatus("語音辨識錯誤：" + e.error, "bad");
    }
  };
  rec.onend = () => {
    committedWords = 0;
    // 辨識中斷時，把還沒送出的字先收下來，再馬上重新開始聽
    const left = $("interim").textContent.trim();
    $("interim").textContent = "";
    if (left) commit(left);
    showDiag();
    if (listening) {
      restarts++;
      // 一啟動就馬上結束、完全沒出字：連續發生表示這種辨識方式在這台電腦不能用，逐步退回
      if (!sessEvents && Date.now() - sessStart < 2000) quickFails++; else quickFails = 0;
      if (useLocal && quickFails >= 15) {
        // 重試了大約 40 秒還是起不來：改回雲端辨識
        quickFails = 0; useLocal = false; $("localSR").checked = false;
        setStatus("這台電腦的本機語音辨識無法使用，已改回雲端辨識", "bad");
      } else if (useLocal && quickFails >= 2) setStatus("本機語音辨識準備中（第一次會比較久，請稍等）…");
      else if (quickFails < 3) setStatus("聆聽中…（已自動重新連線 " + restarts + " 次）", "ok");
      else setStatus("語音辨識一直無法啟動，持續重試中…", "bad");
      setTimeout(startRec, Math.min(150 * Math.pow(2, quickFails), 3000));
    }
  };
  try { rec.start(); } catch (e) { setStatus("無法啟動：" + e.message, "bad"); }
}
// 音量表：只用來確認聲音有沒有進到麥克風，聲音不會被存下來或傳出去
let meterStream = null, meterCtx = null, meterTimer = 0;
async function startMeter() {
  try {
    meterStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    meterCtx = new AudioContext();
    const an = meterCtx.createAnalyser(); an.fftSize = 512;
    meterCtx.createMediaStreamSource(meterStream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    meterTimer = setInterval(() => {
      an.getByteTimeDomainData(buf);
      let peak = 0;
      for (let k = 0; k < buf.length; k++) peak = Math.max(peak, Math.abs(buf[k] - 128));
      $("meterFill").style.width = Math.min(100, peak * 2.5) + "%";
      // 有聲音進來、辨識卻沒有任何反應：累計時間，超過門檻就判定辨識卡住，立刻重啟
      if (listening && peak > 5) loudNoEvent += 100;
      if (listening && rec && loudNoEvent > 4000 + stallStreak * 3000) {
        loudNoEvent = 0; lastEvent = Date.now(); stalls++; stallStreak = Math.min(4, stallStreak + 1); showDiag();
        try { rec.abort(); } catch (e) {}
      }
    }, 100);
  } catch (e) {}
}
function stopMeter() {
  clearInterval(meterTimer);
  if (meterStream) meterStream.getTracks().forEach(t => t.stop());
  if (meterCtx) meterCtx.close();
  meterStream = meterCtx = null; $("meterFill").style.width = "0";
}
function updateBtn() {
  $("listen").textContent = listening ? "⏹ 停止" : "🎤 開始聽";
  $("listen").classList.toggle("on", listening);
}
$("listen").onclick = () => {
  if (!SR) { setStatus("這個瀏覽器不支援語音辨識，請用電腦版 Chrome", "bad"); return; }
  listening = !listening; updateBtn();
  if (listening) {
    setStatus("啟動中…");
    getTranslator("en", "zh-Hant");
    startMeter();
    prepareLocal().then(ok => { useLocal = ok; quickFails = 0; if (listening) { startRec(); showDiag(); } });
  } else {
    try { rec.stop(); } catch (e) {}
    stopMeter();
    $("interim").textContent = "";
    setStatus("已停止");
  }
};

// ---------- 提問小幫手 ----------
function setAskOpen(open) {
  $("askBody").hidden = !open;
  $("askToggle").textContent = "💬 提問小幫手 " + (open ? "▾" : "▸");
  try { localStorage.setItem("ch_ask", open ? "1" : "0"); } catch (e) {}
  if (open) $("askIn").focus();
}
$("askToggle").onclick = () => setAskOpen($("askBody").hidden);
try { if (localStorage.getItem("ch_ask") === "1") { $("askBody").hidden = false; $("askToggle").textContent = "💬 提問小幫手 ▾"; } } catch (e) {}
async function ask() {
  let q = $("askIn").value.trim();
  if (!q) return;
  $("askOut").textContent = "翻譯中…";
  if (aiKey) {
    try {
      const out = await callAI(SYS_ASK, buildCtx({ slide: pageText[page] || "" }) + "學員想問：\n" + q);
      if (out) { $("askOut").textContent = out; return; }
    } catch (e) { setStatus("AI 失敗，先改用一般翻譯：" + e.message, "bad"); }
  }
  q = q.replace(/[。.!！?？\s]+$/, "");
  if (!/^(請問|想請問)/.test(q)) q = "請問" + q;
  try {
    let en = (await translate(q + "？", "zh-Hant", "en")).trim();
    en = en.replace(/^(excuse me|may i ask|can i ask|could i ask)[,:\s]*/i, "").replace(/[.?!\s]+$/, "");
    $("askOut").textContent = "Excuse me. " + en.charAt(0).toUpperCase() + en.slice(1) + "?";
  } catch (e) { $("askOut").textContent = "（翻譯失敗：" + e.message + "）"; }
}
$("askGo").onclick = ask;
$("askIn").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
$("askSay").onclick = () => {
  const t = $("askOut").textContent;
  if (!t || t.startsWith("（") || t === "翻譯中…") return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; u.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};

// ---------- 匯出 ----------
async function pageImage(n, a) {
  // 把投影片連同筆跡、便條編號畫成一張圖，放進匯出的筆記
  const p = await pdf.getPage(n);
  const base = p.getViewport({ scale: 1 });
  const vp = p.getViewport({ scale: 1100 / base.width });
  const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
  const ctx = c.getContext("2d");
  await p.render({ canvasContext: ctx, viewport: vp }).promise;
  if (a) {
    drawInk(ctx, c.width, c.height, a.strokes);
    (a.pins || []).forEach((pin, i) => {
      const x = pin.x * c.width, y = pin.y * c.height;
      ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.fillStyle = "#e53935"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "bold 17px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(i + 1), x, y + 1);
    });
  }
  return c.toDataURL("image/jpeg", 0.82);
}
$("export").onclick = async () => {
  const esc = t => String(t || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const day = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  // 找出所有有筆記、便條、筆跡或重點句的頁面
  const secs = new Map();
  const addSec = k => {
    k = String(k); if (secs.has(k)) return;
    const i = k.lastIndexOf("#");
    secs.set(k, { key: k, doc: i < 0 ? "" : k.slice(0, i), page: +(i < 0 ? k : k.slice(i + 1)) || 0 });
  };
  Object.keys(notes).forEach(k => { if (notes[k] && String(notes[k]).trim()) addSec(k); });
  Object.keys(annots).forEach(k => { const a = annots[k]; if (a && ((a.pins && a.pins.length) || (a.strokes && a.strokes.length))) addSec(k); });
  const lk = l => (l.doc ? l.doc + "#" : "") + (l.page || 0);
  log.forEach(l => { if (l.star) addSec(lk(l)); });
  const list = [...secs.values()].sort((x, y) => x.doc.localeCompare(y.doc) || x.page - y.page);
  setStatus("整理筆記中…");
  let missing = false;
  for (const sec of list) {
    if (pdf && sec.doc === curDoc && sec.page >= 1 && sec.page <= pdf.numPages) {
      try { sec.img = await pageImage(sec.page, annots[sec.key]); } catch (e) {}
    } else if (sec.page >= 1 && sec.doc) missing = true;
  }
  const stars = log.filter(l => l.star).length;
  let h = "<!DOCTYPE html><html lang='zh-Hant'><head><meta charset='utf-8'><title>上課筆記 " + day + "</title><style>" +
    "body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;max-width:900px;margin:24px auto;padding:0 20px;color:#1c2430;line-height:1.6}" +
    "h1{font-size:24px;margin-bottom:4px}h2{font-size:18px;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid #d5dbe5}" +
    ".sum{color:#667}.pg{border:1px solid #d5dbe5;border-radius:8px;padding:10px 14px;margin:14px 0;break-inside:avoid}" +
    ".pg h3{margin:0 0 6px;font-size:16px}.pg img{width:100%;border:1px solid #d5dbe5;border-radius:4px;margin:4px 0}" +
    ".note{white-space:pre-wrap;background:#f3f6fa;border-radius:6px;padding:8px 10px;margin:6px 0}" +
    ".lbl{font-size:12px;color:#667;margin-top:8px}.star{background:#fff3c4;border-left:4px solid #e0a800;border-radius:4px;padding:6px 10px;margin:6px 0}" +
    ".pinrow{display:flex;gap:8px;margin:5px 0;align-items:flex-start}.pn{flex:0 0 22px;height:22px;border-radius:50%;background:#e53935;color:#fff;font:bold 12px/22px sans-serif;text-align:center;margin-top:2px}" +
    ".pt{white-space:pre-wrap}.zh{font-size:16px}.en{font-size:13px;color:#667}.row{padding:5px 10px;margin:3px 0;border-left:4px solid transparent;break-inside:avoid}" +
    ".row.star{margin:6px 0}.t{font-size:11px;color:#99a}@media print{body{margin:0}}" +
    "</style></head><body>";
  h += "<h1>上課筆記</h1><div class='sum'>" + day + "　" + $("ver").textContent + "　共 " + log.length + " 段字幕，" + stars + " 句重點</div>";
  h += "<h2>一、投影片筆記與重點</h2>";
  if (missing) h += "<p class='sum'>有些頁面沒有附投影片圖：匯出時只能畫出「目前載入的那份 PDF」。要補圖的話，載入那份檔案後再匯出一次。</p>";
  if (!list.length) h += "<p class='sum'>這次沒有標重點，也沒有寫筆記。</p>";
  list.forEach(sec => {
    const a = annots[sec.key] || { pins: [] };
    h += "<div class='pg'><h3>" + (sec.page ? (sec.doc ? esc(sec.doc) + "　" : "") + "第 " + sec.page + " 頁" : "還沒載入投影片時") + "</h3>";
    if (sec.img) h += "<img src='" + sec.img + "' alt='投影片第 " + sec.page + " 頁'>";
    if (a.pins && a.pins.length) {
      h += "<div class='lbl'>投影片上的便條</div>";
      a.pins.forEach((p, i) => { h += "<div class='pinrow'><div class='pn'>" + (i + 1) + "</div><div><div class='pt'>" + esc(p.text) + "</div>" + (p.en ? "<div class='en'>" + esc(p.en) + "</div>" : "") + "</div></div>"; });
    }
    const nt = notes[sec.key];
    if (nt && String(nt).trim()) h += "<div class='lbl'>我的筆記</div><div class='note'>" + esc(String(nt).trim()) + "</div>";
    const st = log.filter(l => l.star && lk(l) === sec.key);
    if (st.length) h += "<div class='lbl'>重點句</div>";
    st.forEach(l => { h += "<div class='star'><div class='zh'>★ " + esc(l.zh) + "</div><div class='en'>" + esc(l.en) + "</div><div class='t'>" + esc(l.t) + "</div></div>"; });
    h += "</div>";
  });
  h += "<h2>二、完整逐字稿</h2><div class='sum'>黃底是標過重點的句子。翻譯是機器翻的，重要內容請對照英文。</div>";
  log.forEach(l => {
    h += "<div class='row" + (l.star ? " star" : "") + "'><div class='t'>" + esc(l.t) + (l.page ? "　第 " + l.page + " 頁" : "") + "</div><div class='zh'>" + (l.star ? "★ " : "") + esc(l.zh) + "</div><div class='en'>" + esc(l.en) + "</div></div>";
  });
  h += "</body></html>";
  const el = document.createElement("a");
  el.href = URL.createObjectURL(new Blob([h], { type: "text/html" }));
  el.download = "上課筆記-" + day + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".html";
  el.click();
  setTimeout(() => URL.revokeObjectURL(el.href), 1000);
  setStatus("筆記已匯出", "ok");
};

$("clear").onclick = () => {
  if (!confirm("確定要清除所有字幕、筆記、便條和筆跡嗎？建議先按「匯出筆記」。")) return;
  log = []; notes = {}; annots = {}; save(); saveA(); redrawAll(); $("note").value = ""; $("hits").textContent = "";
  if (pdf) redrawAnnots();
};

// ---------- 中間分隔線可左右拖曳 ----------
(function () {
  const split = $("split"), left = $("left"), main = $("main");
  const apply = px => {
    px = Math.max(200, Math.min(main.clientWidth - 207, px));
    left.style.flex = "0 0 " + px + "px";
  };
  try { const w = +localStorage.getItem("ch_split"); if (w) apply(w); } catch (e) {}
  split.addEventListener("pointerdown", e => {
    split.setPointerCapture(e.pointerId); split.classList.add("drag"); e.preventDefault();
  });
  split.addEventListener("pointermove", e => {
    if (!split.classList.contains("drag")) return;
    apply(e.clientX - main.getBoundingClientRect().left);
  });
  const end = () => {
    if (!split.classList.contains("drag")) return;
    split.classList.remove("drag");
    try { localStorage.setItem("ch_split", left.getBoundingClientRect().width); } catch (e) {}
    if (pdf) showPage(page);
  };
  split.addEventListener("pointerup", end);
  split.addEventListener("pointercancel", end);
})();

redrawAll();
if (!SR) setStatus("這個瀏覽器不支援語音辨識，請用電腦版 Chrome", "bad");
</script>
