<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上課小幫手</title>
<style>
  :root { --bg:#14181f; --panel:#1d232d; --line:#303a48; --text:#e8ecf2; --dim:#94a0b3; --accent:#ffb347; --ok:#5fd08a; --bad:#ff7b72; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif; display:flex; flex-direction:column; }
  button, input, textarea { font:inherit; color:inherit; }
  button { background:#2a3340; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#354152; }
  button.on { background:#7a2b2b; border-color:#b24a4a; }
  #bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  #bar label { color:var(--dim); font-size:14px; display:flex; align-items:center; gap:4px; }
  #engine { font-size:13px; color:var(--accent); }
  #meterBox { font-size:13px; color:var(--dim); display:flex; align-items:center; gap:4px; }
  #meter { display:inline-block; width:90px; height:8px; background:#0d1117; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  #meterFill { display:block; height:100%; width:0; background:var(--ok); }
  #status { margin-left:auto; font-size:14px; color:var(--dim); }
  #status.ok { color:var(--ok); } #status.bad { color:var(--bad); }
  #cfg { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; background:#232b37; border-bottom:1px solid var(--line); font-size:14px; }
  #cfg input { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  .cfgrow { flex-basis:100%; } #glossIn { width:100%; height:150px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; margin:4px 0; } #keyIn { width:320px; } #modelIn { width:180px; }
  #main { flex:1; display:flex; min-height:0; }
  #left { flex:1.3; display:flex; flex-direction:column; min-width:200px; }
  #right { flex:1; display:flex; flex-direction:column; min-width:200px; }
  #split { flex:0 0 7px; cursor:col-resize; background:var(--line); }
  #split:hover, #split.drag { background:var(--accent); }
  #nav { display:flex; gap:8px; align-items:center; padding:6px 12px; font-size:14px; color:var(--dim); }
  #slideWrap { flex:1; overflow:auto; padding:0 12px; min-height:0; }
  #slide { display:block; max-width:100%; background:#fff; border-radius:4px; }
  #empty { color:var(--dim); padding:40px 12px; text-align:center; line-height:1.9; }
  #hits { padding:4px 12px; min-height:28px; font-size:13px; color:var(--dim); }
  #hits span { display:inline-block; background:#4a3a14; color:var(--accent); border-radius:10px; padding:1px 8px; margin:2px 4px 2px 0; }
  #note { margin:6px 12px 10px; height:90px; resize:vertical; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; }
  #caps { flex:1; overflow:auto; padding:10px 12px; min-height:0; }
  .line { padding:4px 8px; border-radius:6px; margin-bottom:2px; cursor:pointer; border-left:3px solid transparent; line-height:1.35; }
  .line:hover { background:var(--panel); }
  .line.star { background:#33290f; border-left-color:var(--accent); }
  .line .meta { font-size:11px; color:var(--dim); }
  .line .en { font-size:12px; color:#8f9bb0; }
  .line .zh { font-size:15px; margin-top:1px; }
  #interim { padding:6px 12px; color:var(--dim); font-style:italic; min-height:34px; border-top:1px solid var(--line); }
  #ask { padding:10px 12px; border-top:1px solid var(--line); background:var(--panel); }
  #ask .row { display:flex; gap:8px; align-items:flex-start; }
  #askIn { flex:1; height:64px; resize:vertical; line-height:1.5; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  #askOut { margin-top:8px; font-size:18px; color:var(--accent); min-height:24px; }
  .hint { font-size:12px; color:var(--dim); }
</style>
</head>
<body>

<div id="bar">
  <label>投影片 PDF <input type="file" id="file" accept="application/pdf"></label>
  <button id="listen">🎤 開始聽</button>
  <label><input type="checkbox" id="follow"> 自動對頁</label>
  <label><input type="checkbox" id="autoscroll" checked> 字幕自動捲到最新</label>
  <label title="用筆電本機的語音辨識，聲音不會傳到 Google。這台電腦不支援時會自動改用雲端。"><input type="checkbox" id="localSR" checked> 本機語音辨識</label>
  <button id="export">⬇ 匯出筆記</button>
  <button id="clear">清除紀錄</button>
  <button id="cfgBtn">⚙ AI 翻譯</button>
  <span id="ver" style="font-size:12px;color:var(--dim)">版本 19</span>
  <span id="engine"></span>
  <span id="meterBox" title="麥克風收到的音量">🎚 <span id="meter"><span id="meterFill"></span></span></span>
  <span id="status">尚未開始</span>
</div>

<div id="cfg" hidden>
  <span>AI 金鑰</span>
  <input id="keyIn" type="password" placeholder="貼上 API 金鑰（只存在這台電腦）">
  <span>模型</span>
  <input id="modelIn" placeholder="claude-haiku-5-5">
  <button id="cfgSave">儲存</button>
  <span class="hint">留空白就用一般翻譯。金鑰不要放到 GitHub 上。</span>
  <div class="cfgrow">
    <label><input type="checkbox" id="sendSlide"> 把當頁投影片文字也傳給 AI 參考（教材不能外流時請不要勾）</label>
  </div>
  <div class="cfgrow">
    <div class="hint">名詞表：一行一個，格式是「英文 = 中文」。可以自己增加或修改，只存在這台電腦。</div>
    <textarea id="glossIn" spellcheck="false"></textarea>
    <button id="glossReset">還原成預設名詞表</button>
  </div>
</div>

<div id="main">
  <div id="left">
    <div id="nav">
      <button id="prev">◀ 上一頁</button>
      <span id="pageInfo">尚未載入投影片</span>
      <button id="next">下一頁 ▶</button>
    </div>
    <div id="slideWrap">
      <div id="empty">請用左上角選擇 PDF 投影片。<br>沒有投影片也可以直接按「開始聽」，只用字幕翻譯。</div>
      <canvas id="slide" hidden></canvas>
    </div>
    <div id="hits"></div>
    <textarea id="note" placeholder="這一頁的筆記（會自動儲存）"></textarea>
  </div>

  <div id="split" title="左右拖曳調整寬度"></div>
  <div id="right">
    <div id="caps"></div>
    <div id="interim"></div>
    <div id="diag" class="hint" style="padding:2px 12px"></div>
    <div id="ask">
      <div class="hint">提問小幫手：用中文打想問的問題，按 Enter 變成英文問句（Shift + Enter 換行）</div>
      <div class="row">
        <textarea id="askIn" placeholder="例如：這個設定預設值是多少"></textarea>
        <button id="askGo">翻成英文</button>
        <button id="askSay">🔊 唸給我聽</button>
      </div>
      <div id="askOut"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const setStatus = (msg, cls) => { $("status").textContent = msg; $("status").className = cls || ""; };
let curEngine = "";
const setEngine = name => { curEngine = name; $("engine").textContent = "翻譯：" + name; };

// ---------- 儲存 ----------
let notes = {}, log = [];
try { notes = JSON.parse(localStorage.getItem("ch_notes") || "{}"); } catch (e) {}
try { log = JSON.parse(localStorage.getItem("ch_log") || "[]"); } catch (e) {}
function save() {
  try {
    localStorage.setItem("ch_notes", JSON.stringify(notes));
    localStorage.setItem("ch_log", JSON.stringify(log));
  } catch (e) {}
}

// ---------- AI 翻譯設定 ----------
const DEFAULT_MODEL = "claude-haiku-5-5";
const DEFAULT_GLOSS = "MANET = 行動隨意網路\nad hoc network = 隨意網路（不靠固定設施、臨時自組的網路）\nmesh network = 網狀網路\nnode = 節點\nmaster node = 主節點\nrelay = 中繼\nhop = 跳（訊號經過一個節點算一跳）\nmulti-hop = 多跳\nrouting = 路由\nrouting protocol = 路由協定\ntopology = 拓撲（網路的連接架構）\nself-forming = 自動組網\nself-configuring = 自我組態\nself-healing = 自我修復\ninfrastructure = 基礎設施\nbase station = 基地台\nrepeater = 中繼台\ngateway = 閘道\nbackhaul = 回程鏈路\nlink = 鏈路\nlink budget = 鏈路預算\nline of sight (LOS) = 視距\nnon-line of sight (NLOS) = 非視距\ncoverage = 涵蓋範圍\nrange = 通訊距離\nthroughput = 傳輸量\nbandwidth = 頻寬\nlatency = 延遲\nfrequency band = 頻段\nchannel = 頻道\nspectrum = 頻譜\ninterference = 干擾\nantenna = 天線\nomnidirectional antenna = 全向天線\ndirectional antenna = 指向天線\ngain = 增益\ntransmit power = 發射功率\nSNR (signal-to-noise ratio) = 訊雜比\nRSSI = 接收訊號強度指標\nMIMO = 多輸入多輸出\nwaveform = 波形\nencryption = 加密\npacket = 封包\npacket loss = 封包遺失\nQoS = 服務品質\nIP address = IP 位址\nsubnet = 子網路\nDHCP = 動態主機設定協定\nVLAN = 虛擬區域網路\nunicast = 單播\nmulticast = 群播\nbroadcast = 廣播\nPTT (push-to-talk) = 按鍵通話\ntalk group = 通話群組\nLMR (land mobile radio) = 陸地行動無線電\ntrunking = 集群式無線電\nDMR = 數位行動無線電\nTETRA = TETRA 數位集群無線電\nP25 = P25 數位無線電標準\ninteroperability = 互通性\nsituational awareness = 狀況覺知\nincident command = 事故現場指揮\nfirst responder = 第一線救災人員\ndeployment = 部署\nconfiguration = 設定\nfirmware = 韌體\nUAV = 無人機\nvideo streaming = 影像串流\nGNSS = 衛星定位";
let gloss = DEFAULT_GLOSS, sendSlide = false;
try { const g = localStorage.getItem("ch_gloss"); if (g !== null) gloss = g; sendSlide = localStorage.getItem("ch_slide") === "1"; } catch (e) {}
let aiKey = "", aiModel = DEFAULT_MODEL;
try { aiKey = localStorage.getItem("ch_key") || ""; aiModel = localStorage.getItem("ch_model") || DEFAULT_MODEL; } catch (e) {}
$("keyIn").value = aiKey; $("modelIn").value = aiModel;
$("glossIn").value = gloss; $("sendSlide").checked = sendSlide;
$("glossReset").onclick = () => { $("glossIn").value = DEFAULT_GLOSS; };
$("cfgBtn").onclick = () => { $("cfg").hidden = !$("cfg").hidden; };
$("cfgSave").onclick = () => {
  aiKey = $("keyIn").value.trim();
  aiModel = $("modelIn").value.trim() || DEFAULT_MODEL;
  gloss = $("glossIn").value.trim(); sendSlide = $("sendSlide").checked;
  try { localStorage.setItem("ch_key", aiKey); localStorage.setItem("ch_model", aiModel); localStorage.setItem("ch_gloss", gloss); localStorage.setItem("ch_slide", sendSlide ? "1" : "0"); } catch (e) {}
  $("cfg").hidden = true;
  setEngine(aiKey ? "AI（已設定金鑰）" : "一般");
};
setEngine(aiKey ? "AI（已設定金鑰）" : "一般");

const SYS_TR = "你是課堂即時口譯。把老師講的英文翻成台灣用的繁體中文。這是消防機關的課程，主題是無線 Mesh 網路與 MANET（行動隨意網路）、無線電通訊，專有名詞請用台灣慣用的說法，MANET、DMR、TETRA、P25 這類縮寫保留英文。語音辨識常聽錯專有名詞，例如把 MANET 聽成 Monday、mayonnaise、May，把 node 聽成 note，把 ad hoc 聽成 unlock，請依上下文和投影片修正後再翻。內容是從連續講話中切出來的一小段，開頭或結尾可能不是完整句子，照原樣翻成通順的中文片段，不要自己補完。每次只翻使用者最新送來的這一段；之前的段落已經翻過，只用來了解上下文，絕對不要再翻一次。如果這一段是接著上一段沒講完的句子，就從接續的地方直接寫起，開頭不要重述上一段。範例：上一段是「these networks are designed to be geographically static and rely heavily on」，已翻成「這些網路被設計成地理位置固定，並且高度依賴」；這一段是「a fixed infrastructure typically such a network has one node designated as the master node」，正確輸出是「固定的基礎設施。通常這類網路會指定一個節點作為主節點」，錯誤輸出是把「這些網路被設計成地理位置固定」再寫一次。不要加入原文沒有的意思，尤其不要自己加上否定或把意思反過來；開頭缺字時，依前一段推測最合理的銜接。就算只有一兩個字、或看不懂，也只輸出最可能的中文翻譯，絕對不要解釋、不要分析、不要提到語音辨識。";
const SYS_ASK = "把學員想問的中文，改寫成一句禮貌、簡單、口語的英文問句，方便在課堂上舉手發問。用詞可以參考投影片。只輸出英文問句，不要加任何說明。";
function buildCtx(c) {
  let s = "";
  if (gloss) s += "名詞表（左邊英文、右邊是要用的中文說法；聽錯成發音相近的字時請修正）：\n" + gloss + "\n\n";
  if (sendSlide && c && c.slide) s += "目前投影片上的文字（只供參考，不要翻譯）：\n" + c.slide + "\n\n";
  return s;
}
async function callAI(system, user, history) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": aiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: aiModel, max_tokens: 700, system: system, messages: (history || []).concat([{ role: "user", content: user }]) })
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return (j.content || []).map(c => c.text || "").join("").trim();
}

// ---------- PDF ----------
let pdf = null, page = 0, pageWords = [], pageText = [], docFreq = {}, rendering = false, pendingPage = 0;
const STOP = new Set("this that with from have will your they them then than what when where which while there their about into over also been were would could should these those here just like some more most very much many such only other each because between after before under again does doing done make made using used being".split(" "));
const words = s => (s.toLowerCase().match(/[a-z][a-z\-]{3,}/g) || []).filter(w => !STOP.has(w));

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

$("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (!window.pdfjsLib) { setStatus("PDF 元件載入失敗，請檢查網路", "bad"); return; }
  try {
    setStatus("讀取投影片中…");
    pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    pageWords = []; pageText = []; docFreq = {};
    for (let i = 1; i <= pdf.numPages; i++) {
      const p = await pdf.getPage(i);
      const tc = await p.getTextContent();
      const raw = tc.items.map(it => it.str).join(" ");
      pageText[i] = raw.slice(0, 1500);
      const set = new Set(words(raw));
      pageWords[i] = set;
      set.forEach(w => { docFreq[w] = (docFreq[w] || 0) + 1; });
    }
    $("empty").hidden = true; $("slide").hidden = false;
    await showPage(1);
    setStatus("投影片已載入，共 " + pdf.numPages + " 頁", "ok");
  } catch (err) {
    setStatus("PDF 讀取失敗：" + err.message, "bad");
  }
});

async function showPage(n) {
  if (!pdf) return;
  n = Math.max(1, Math.min(pdf.numPages, n));
  if (rendering) { pendingPage = n; return; }
  rendering = true;
  try {
    const p = await pdf.getPage(n);
    const base = p.getViewport({ scale: 1 });
    const width = Math.max(300, $("slideWrap").clientWidth - 24);
    const dpr = window.devicePixelRatio || 1;
    const vp = p.getViewport({ scale: (width / base.width) * dpr });
    const c = $("slide");
    c.width = vp.width; c.height = vp.height;
    c.style.width = (vp.width / dpr) + "px";
    await p.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    page = n;
    $("pageInfo").textContent = "第 " + n + " / " + pdf.numPages + " 頁";
    $("note").value = notes[n] || "";
  } catch (err) {
    setStatus("頁面顯示失敗：" + err.message, "bad");
  }
  rendering = false;
  if (pendingPage) { const q = pendingPage; pendingPage = 0; if (q !== page) showPage(q); }
}
$("prev").onclick = () => showPage(page - 1);
$("next").onclick = () => showPage(page + 1);
window.addEventListener("resize", () => { if (pdf) showPage(page); });
document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key === "ArrowLeft") showPage(page - 1);
  if (e.key === "ArrowRight") showPage(page + 1);
});
$("note").addEventListener("input", () => { if (page) { notes[page] = $("note").value; save(); } });

// ---------- 自動對頁 ----------
function followSlides() {
  if (!pdf) return;
  const recent = new Set(words(log.slice(-2).map(l => l.en).join(" ")));
  let best = 0, bestScore = 0, curScore = 0, bestHits = [], curHits = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    let s = 0; const hits = [];
    recent.forEach(w => {
      if (pageWords[i].has(w)) { s += Math.log(1 + pdf.numPages / docFreq[w]); hits.push(w); }
    });
    if (i === page) { curScore = s; curHits = hits; }
    if (s > bestScore) { bestScore = s; best = i; bestHits = hits; }
  }
  let shown = curHits;
  if ($("follow").checked && best && best !== page && bestHits.length >= 3 && bestScore > curScore * 1.6 + 1) {
    showPage(best); shown = bestHits;
  }
  const box = $("hits"); box.textContent = "";
  if (shown.length) {
    box.append("對到的關鍵字：");
    shown.slice(0, 10).forEach(w => { const s = document.createElement("span"); s.textContent = w; box.append(s); });
  }
}

// ---------- 翻譯 ----------
const translators = {};
async function getTranslator(from, to) {
  const key = from + ">" + to;
  if (key in translators) return translators[key];
  translators[key] = null;
  try {
    if ("Translator" in self) {
      const a = await Translator.availability({ sourceLanguage: from, targetLanguage: to });
      if (a !== "unavailable") {
        translators[key] = await Translator.create({ sourceLanguage: from, targetLanguage: to });
      }
    }
  } catch (e) { translators[key] = null; }
  return translators[key];
}
async function translate(text, from, to, ctx) {
  if (aiKey && from === "en") {
    try {
      // 前一段用「上一輪對話」的方式給 AI 看，它就只會接著翻新的這段，不會重翻
      const hist = (ctx && ctx.prev && ctx.prevZh && !ctx.prevZh.startsWith("（翻譯失敗")) ? [{ role: "user", content: ctx.prev }, { role: "assistant", content: ctx.prevZh }] : [];
      const sys = SYS_TR + "\n\n" + buildCtx(ctx);
      const lastPara = t => { const ps = t.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean); return ps.length ? ps[ps.length - 1] : t; };
      let out = lastPara(await callAI(sys, text, hist));
      // 中文通常只有英文字元數的三到四成；明顯太長多半是把前一段又翻了一次，要求它重來一次
      if (hist.length && text.length > 40 && out.length > text.length * 0.55) {
        try {
          const again = lastPara(await callAI(sys, "你的翻譯太長，包含了前面段落已經翻過的內容。請只輸出最新這一段英文對應的中文，不要重述前文，不要解釋。", hist.concat([{ role: "user", content: text }, { role: "assistant", content: out }])));
          if (again && again.length < out.length) out = again;
        } catch (e) {}
      }
      if (out) { setEngine("AI"); return out; }
    } catch (e) { setStatus("AI 翻譯失敗，先改用一般翻譯：" + e.message, "bad"); }
  }
  const t = await getTranslator(from, to);
  if (t) { try { const o = await t.translate(text); setEngine("Chrome 內建"); return o; } catch (e) {} }
  const pair = (from === "en" ? "en" : "zh-TW") + "|" + (to === "en" ? "en" : "zh-TW");
  const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + encodeURIComponent(pair));
  const j = await r.json();
  if (j && j.responseData && j.responseData.translatedText) { setEngine("線上免費（額度小）"); return j.responseData.translatedText; }
  throw new Error("翻譯服務沒有回應");
}

// ---------- 字幕（整段翻譯）----------
const PAUSE = 3000, MAXLEN = 260, CHUNK_WORDS = 28, HOLD_WORDS = 5;
function drawLine(l, i) {
  const d = document.createElement("div");
  d.className = "line" + (l.star ? " star" : "");
  d.title = "點一下標成重點";
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = l.t + (l.page ? "　第 " + l.page + " 頁" : "") + (l.eng ? "　" + l.eng : "") + (l.star ? "　★ 重點" : "");
  const en = document.createElement("div"); en.className = "en"; en.textContent = l.en;
  const zh = document.createElement("div"); zh.className = "zh"; zh.textContent = l.zh || "翻譯中…";
  d.append(meta, en, zh);
  d.onclick = () => { l.star = !l.star; save(); d.replaceWith(drawLine(l, i)); };
  d.id = "line" + i;
  return d;
}
function refresh(i) {
  const old = $("line" + i);
  if (old) old.replaceWith(drawLine(log[i], i));
}
function redrawAll() {
  $("caps").textContent = "";
  log.forEach((l, i) => $("caps").append(drawLine(l, i)));
  $("caps").scrollTop = $("caps").scrollHeight;
}
function toBottom() { if ($("autoscroll").checked) $("caps").scrollTop = $("caps").scrollHeight; }
async function addLine(en, gap) {
  en = en.trim();
  if (!en) return;
  const box = $("caps");
  
  let i = log.length - 1, l = log[i];
  if (l && gap < PAUSE && l.page === (page || 0) && l.en.length + en.length < MAXLEN) {
    l.en += " " + en;
    refresh(i);
  } else {
    l = { t: new Date().toTimeString().slice(0, 8), page: page || 0, en: en, zh: "", star: false };
    i = log.push(l) - 1;
    box.append(drawLine(l, i));
  }
  l.v = (l.v || 0) + 1;
  const v = l.v;
  toBottom();
  followSlides();
  let zh;
  try { zh = await translate(l.en, "en", "zh-Hant", { slide: pageText[l.page] || "", prev: i > 0 ? log[i - 1].en : "", prevZh: i > 0 ? (log[i - 1].zh || "") : "" }); }
  catch (e) { zh = "（翻譯失敗：" + e.message + "）"; }
  if (l.v !== v) return;
  l.zh = zh; l.eng = curEngine; save(); refresh(i);
  toBottom();
}

// ---------- 語音辨識 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let evCount = 0, lastErr = "無", lastHeard = "尚未", loudNoEvent = 0, stalls = 0, stallStreak = 0;
function showDiag() { $("diag").textContent = "診斷：辨識方式 " + srMode + "｜辨識事件 " + evCount + " 次｜重新連線 " + restarts + " 次（其中卡住重啟 " + stalls + " 次）｜最後錯誤 " + lastErr + "｜最後聽到字 " + lastHeard; }
let rec = null, listening = false, lastEnd = 0, committedWords = 0, lastEvent = 0, restarts = 0;
// Chrome 的語音辨識有時會自己卡住不出字：超過 15 秒沒動靜就重新啟動
setInterval(() => {
  if (listening && rec && Date.now() - lastEvent > 15000) { lastEvent = Date.now(); try { rec.abort(); } catch (e) {} }
}, 3000);
const toWords = t => t.trim().split(/\s+/).filter(Boolean);
function commit(text) {
  const w = toWords(text);
  for (let k = 0; k < w.length; k += 40) {
    const now = Date.now();
    addLine(w.slice(k, k + 40).join(" "), lastEnd ? now - lastEnd : Infinity);
    lastEnd = now;
  }
}
let useLocal = false, usePhrases = false, srMode = "雲端", sessStart = 0, sessEvents = 0, quickFails = 0;
async function prepareLocal() {
  // 新版 Chrome 可以在筆電上直接辨識，不經過 Google 伺服器；不支援就回傳 false
  try {
    if (!$("localSR").checked || !SR.available) return false;
    const opt = { langs: ["en-US"], processLocally: true };
    let st = await SR.available(opt);
    if (st === "downloadable" || st === "downloading") {
      setStatus("第一次使用：下載本機語音辨識模型中，請稍等…");
      await SR.install(opt);
      st = await SR.available(opt);
    }
    return st === "available";
  } catch (e) { return false; }
}
function startRec() {
  rec = new SR();
  sessStart = Date.now(); sessEvents = 0;
  rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true;
  srMode = "雲端";
  if (useLocal) {
    try {
      rec.processLocally = true; srMode = "本機";
      // 把名詞表的英文交給辨識器，讓它比較容易聽出專有名詞
      if (usePhrases && window.SpeechRecognitionPhrase) {
        const terms = gloss.split("\n").map(x => x.split("=")[0].replace(/\(.*?\)/g, "").trim()).filter(x => x && x.length < 40).slice(0, 80);
        rec.phrases = terms.map(t => new SpeechRecognitionPhrase(t, 4.0));
        srMode = "本機＋名詞表";
      }
    } catch (e) {}
  }
  committedWords = 0;
  rec.onstart = () => { sessStart = Date.now(); sessEvents = 0; lastEvent = Date.now(); loudNoEvent = 0; setStatus("聆聽中…", "ok"); };
  rec.onresult = e => {
    lastEvent = Date.now(); loudNoEvent = 0; stallStreak = 0; evCount++; sessEvents++; quickFails = 0; lastHeard = new Date().toTimeString().slice(0, 8); showDiag();
    let interim = "";
    for (let i = 0; i < e.results.length; i++) {
      const txt = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        if (i < e.resultIndex) continue;   // 之前已經處理過的句子
        const w = toWords(txt);
        const rest = w.slice(committedWords).join(" ");
        committedWords = Math.max(0, committedWords - w.length);
        if (rest) commit(rest);
      } else interim += txt;
    }
    // 老師一直講沒停頓時，不等辨識結束，先把前面穩定的部分切出來翻
    let pending = toWords(interim).slice(committedWords);
    if (pending.length >= CHUNK_WORDS + HOLD_WORDS) {
      const take = pending.length - HOLD_WORDS;
      commit(pending.slice(0, take).join(" "));
      committedWords += take;
      pending = pending.slice(take);
    }
    $("interim").textContent = pending.join(" ");
  };
  rec.onerror = e => {
    lastErr = e.error + (e.message ? "（" + e.message + "）" : ""); showDiag();
    if (e.error === "no-speech" || e.error === "aborted") return;
    if (useLocal && (e.error === "language-not-supported" || e.error === "phrases-not-supported" || e.error === "service-not-allowed")) {
      useLocal = false; $("localSR").checked = false;   // 本機辨識不能用：改回雲端，onend 會自動重啟
      return;
    }
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false; updateBtn();
      setStatus("麥克風被擋住了：請點網址列左邊的圖示，把麥克風改成允許", "bad");
    } else if (e.error === "audio-capture") {
      setStatus("找不到麥克風，或麥克風被別的程式佔用", "bad");
    } else if (e.error === "network") {
      setStatus("語音辨識需要網路，請檢查連線", "bad");
    } else {
      setStatus("語音辨識錯誤：" + e.error, "bad");
    }
  };
  rec.onend = () => {
    committedWords = 0;
    // 辨識中斷時，把還沒送出的字先收下來，再馬上重新開始聽
    const left = $("interim").textContent.trim();
    $("interim").textContent = "";
    if (left) commit(left);
    showDiag();
    if (listening) {
      restarts++;
      // 一啟動就馬上結束、完全沒出字：連續發生表示這種辨識方式在這台電腦不能用，逐步退回
      if (!sessEvents && Date.now() - sessStart < 2000) quickFails++; else quickFails = 0;
      if (useLocal && quickFails >= 15) {
        // 重試了大約 40 秒還是起不來：改回雲端辨識
        quickFails = 0; useLocal = false; $("localSR").checked = false;
        setStatus("這台電腦的本機語音辨識無法使用，已改回雲端辨識", "bad");
      } else if (useLocal && quickFails >= 2) setStatus("本機語音辨識準備中（第一次會比較久，請稍等）…");
      else if (quickFails < 3) setStatus("聆聽中…（已自動重新連線 " + restarts + " 次）", "ok");
      else setStatus("語音辨識一直無法啟動，持續重試中…", "bad");
      setTimeout(startRec, Math.min(150 * Math.pow(2, quickFails), 3000));
    }
  };
  try { rec.start(); } catch (e) { setStatus("無法啟動：" + e.message, "bad"); }
}
// 音量表：只用來確認聲音有沒有進到麥克風，聲音不會被存下來或傳出去
let meterStream = null, meterCtx = null, meterTimer = 0;
async function startMeter() {
  try {
    meterStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    meterCtx = new AudioContext();
    const an = meterCtx.createAnalyser(); an.fftSize = 512;
    meterCtx.createMediaStreamSource(meterStream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    meterTimer = setInterval(() => {
      an.getByteTimeDomainData(buf);
      let peak = 0;
      for (let k = 0; k < buf.length; k++) peak = Math.max(peak, Math.abs(buf[k] - 128));
      $("meterFill").style.width = Math.min(100, peak * 2.5) + "%";
      // 有聲音進來、辨識卻沒有任何反應：累計時間，超過門檻就判定辨識卡住，立刻重啟
      if (listening && peak > 5) loudNoEvent += 100;
      if (listening && rec && loudNoEvent > 4000 + stallStreak * 3000) {
        loudNoEvent = 0; lastEvent = Date.now(); stalls++; stallStreak = Math.min(4, stallStreak + 1); showDiag();
        try { rec.abort(); } catch (e) {}
      }
    }, 100);
  } catch (e) {}
}
function stopMeter() {
  clearInterval(meterTimer);
  if (meterStream) meterStream.getTracks().forEach(t => t.stop());
  if (meterCtx) meterCtx.close();
  meterStream = meterCtx = null; $("meterFill").style.width = "0";
}
function updateBtn() {
  $("listen").textContent = listening ? "⏹ 停止" : "🎤 開始聽";
  $("listen").classList.toggle("on", listening);
}
$("listen").onclick = () => {
  if (!SR) { setStatus("這個瀏覽器不支援語音辨識，請用電腦版 Chrome", "bad"); return; }
  listening = !listening; updateBtn();
  if (listening) {
    setStatus("啟動中…");
    getTranslator("en", "zh-Hant");
    startMeter();
    prepareLocal().then(ok => { useLocal = ok; quickFails = 0; if (listening) { startRec(); showDiag(); } });
  } else {
    try { rec.stop(); } catch (e) {}
    stopMeter();
    $("interim").textContent = "";
    setStatus("已停止");
  }
};

// ---------- 提問小幫手 ----------
async function ask() {
  let q = $("askIn").value.trim();
  if (!q) return;
  $("askOut").textContent = "翻譯中…";
  if (aiKey) {
    try {
      const out = await callAI(SYS_ASK, buildCtx({ slide: pageText[page] || "" }) + "學員想問：\n" + q);
      if (out) { $("askOut").textContent = out; return; }
    } catch (e) { setStatus("AI 失敗，先改用一般翻譯：" + e.message, "bad"); }
  }
  q = q.replace(/[。.!！?？\s]+$/, "");
  if (!/^(請問|想請問)/.test(q)) q = "請問" + q;
  try {
    let en = (await translate(q + "？", "zh-Hant", "en")).trim();
    en = en.replace(/^(excuse me|may i ask|can i ask|could i ask)[,:\s]*/i, "").replace(/[.?!\s]+$/, "");
    $("askOut").textContent = "Excuse me. " + en.charAt(0).toUpperCase() + en.slice(1) + "?";
  } catch (e) { $("askOut").textContent = "（翻譯失敗：" + e.message + "）"; }
}
$("askGo").onclick = ask;
$("askIn").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
$("askSay").onclick = () => {
  const t = $("askOut").textContent;
  if (!t || t.startsWith("（") || t === "翻譯中…") return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; u.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};

// ---------- 匯出 ----------
$("export").onclick = () => {
  const esc = t => String(t || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const day = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const pages = new Set();
  Object.keys(notes).forEach(k => { if (notes[k] && notes[k].trim()) pages.add(+k); });
  log.forEach(l => { if (l.star) pages.add(l.page || 0); });
  const stars = log.filter(l => l.star).length;
  let h = "<!DOCTYPE html><html lang='zh-Hant'><head><meta charset='utf-8'><title>上課筆記 " + day + "</title><style>" +
    "body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;max-width:860px;margin:24px auto;padding:0 20px;color:#1c2430;line-height:1.6}" +
    "h1{font-size:24px;margin-bottom:4px}h2{font-size:18px;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid #d5dbe5}" +
    ".sum{color:#667}.pg{border:1px solid #d5dbe5;border-radius:8px;padding:10px 14px;margin:10px 0;break-inside:avoid}" +
    ".pg h3{margin:0 0 6px;font-size:16px}.note{white-space:pre-wrap;background:#f3f6fa;border-radius:6px;padding:8px 10px;margin:6px 0}" +
    ".lbl{font-size:12px;color:#667;margin-top:6px}.star{background:#fff3c4;border-left:4px solid #e0a800;border-radius:4px;padding:6px 10px;margin:6px 0}" +
    ".zh{font-size:16px}.en{font-size:13px;color:#667}.row{padding:5px 10px;margin:3px 0;border-left:4px solid transparent;break-inside:avoid}" +
    ".row.star{margin:6px 0}.t{font-size:11px;color:#99a}@media print{body{margin:0}}" +
    "</style></head><body>";
  h += "<h1>上課筆記</h1><div class='sum'>" + day + "　" + $("ver").textContent + "　共 " + log.length + " 段字幕，" + stars + " 句重點</div>";
  h += "<h2>一、重點與我的筆記</h2>";
  if (!pages.size) h += "<p class='sum'>這次沒有標重點，也沒有寫筆記。</p>";
  [...pages].sort((a, b) => a - b).forEach(p => {
    h += "<div class='pg'><h3>" + (p ? "投影片第 " + p + " 頁" : "還沒載入投影片時") + "</h3>";
    if (notes[p] && notes[p].trim()) h += "<div class='lbl'>我的筆記</div><div class='note'>" + esc(notes[p].trim()) + "</div>";
    const st = log.filter(l => l.star && (l.page || 0) === p);
    if (st.length) h += "<div class='lbl'>重點句</div>";
    st.forEach(l => { h += "<div class='star'><div class='zh'>★ " + esc(l.zh) + "</div><div class='en'>" + esc(l.en) + "</div><div class='t'>" + esc(l.t) + "</div></div>"; });
    h += "</div>";
  });
  h += "<h2>二、完整逐字稿</h2><div class='sum'>黃底是標過重點的句子。翻譯是機器翻的，重要內容請對照英文。</div>";
  log.forEach(l => {
    h += "<div class='row" + (l.star ? " star" : "") + "'><div class='t'>" + esc(l.t) + (l.page ? "　第 " + l.page + " 頁" : "") + "</div><div class='zh'>" + (l.star ? "★ " : "") + esc(l.zh) + "</div><div class='en'>" + esc(l.en) + "</div></div>";
  });
  h += "</body></html>";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([h], { type: "text/html" }));
  a.download = "上課筆記-" + day + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".html";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

$("clear").onclick = () => {
  if (!confirm("確定要清除所有字幕和筆記嗎？建議先按「匯出筆記」。")) return;
  log = []; notes = {}; save(); redrawAll(); $("note").value = ""; $("hits").textContent = "";
};

// ---------- 中間分隔線可左右拖曳 ----------
(function () {
  const split = $("split"), left = $("left"), main = $("main");
  const apply = px => {
    px = Math.max(200, Math.min(main.clientWidth - 207, px));
    left.style.flex = "0 0 " + px + "px";
  };
  try { const w = +localStorage.getItem("ch_split"); if (w) apply(w); } catch (e) {}
  split.addEventListener("pointerdown", e => {
    split.setPointerCapture(e.pointerId); split.classList.add("drag"); e.preventDefault();
  });
  split.addEventListener("pointermove", e => {
    if (!split.classList.contains("drag")) return;
    apply(e.clientX - main.getBoundingClientRect().left);
  });
  const end = () => {
    if (!split.classList.contains("drag")) return;
    split.classList.remove("drag");
    try { localStorage.setItem("ch_split", left.getBoundingClientRect().width); } catch (e) {}
    if (pdf) showPage(page);
  };
  split.addEventListener("pointerup", end);
  split.addEventListener("pointercancel", end);
})();

redrawAll();
if (!SR) setStatus("這個瀏覽器不支援語音辨識，請用電腦版 Chrome", "bad");
</script>
</body>
